<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福島交通バスロケーション</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", Meiryo, sans-serif;
      background: #e7d7a8;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #pageTitle {
      position: absolute;
      z-index: 10;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 12px;
      background: rgba(255,255,255,.90);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
    }

    #timestampDisplay {
      position: absolute;
      z-index: 10;
      right: 8px;
      bottom: 8px;
      padding: 5px 8px;
      background: rgba(20,28,36,.82);
      color: #fff;
      font-size: 11px;
      border-radius: 999px;
      box-shadow: 0 5px 18px rgba(0,0,0,.18);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #statusDisplay {
      position: absolute;
      z-index: 10;
      left: 8px;
      bottom: 8px;
      padding: 5px 8px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.12);
      font-size: 11px;
      border-radius: 999px;
      box-shadow: 0 5px 18px rgba(0,0,0,.14);
      backdrop-filter: blur(8px);
      max-width: 48vw;
    }

    .maplibregl-popup {
      max-width: 320px !important;
    }

    .maplibregl-popup-content {
      padding: 0;
      overflow: hidden;
      border-radius: 16px;
      background: rgba(255,255,255,.96);
      box-shadow:
        0 18px 45px rgba(0,0,0,.22),
        0 3px 12px rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .maplibregl-popup-close-button {
      width: 30px;
      height: 30px;
      top: 7px;
      right: 7px;
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      line-height: 28px;
      background: rgba(0,0,0,.18);
      transition: .15s ease;
      z-index: 3;
    }

    .maplibregl-popup-close-button:hover {
      background: rgba(0,0,0,.32);
    }

    .maplibregl-popup-tip {
      border-top-color: rgba(255,255,255,.96) !important;
    }

    .bus-popup {
      min-width: 250px;
      color: #17202a;
    }

    .bus-popup__hero {
      position: relative;
      padding: 17px 46px 15px 18px;
      color: #fff;
      background:
        radial-gradient(circle at 100% 0%, rgba(255,255,255,.24), transparent 42%),
        linear-gradient(135deg, #1769aa 0%, #2386c8 52%, #31a8df 100%);
    }

    .bus-popup__eyebrow {
      margin-bottom: 3px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      opacity: .76;
    }

    .bus-popup__vehicle {
      font-size: 23px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: .02em;
      text-shadow: 0 1px 2px rgba(0,0,0,.15);
    }

    .bus-popup__body {
      padding: 14px 16px 15px;
    }

    .bus-popup__route {
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .bus-popup__destination {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      color: #4b5966;
      font-size: 12px;
      line-height: 1.35;
    }

    .bus-popup__destination::before {
      content: "→";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      border-radius: 50%;
      color: #1769aa;
      background: #eaf5fb;
      font-weight: 900;
    }

    .bus-popup__footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 11px;
      border-top: 1px solid #edf0f2;
    }

    .bus-popup__delay {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .bus-popup__delay--ok {
      color: #147a44;
      background: #e7f7ee;
    }

    .bus-popup__delay--late {
      color: #b55a00;
      background: #fff1df;
    }

    .bus-popup__trip {
      color: #8b98a4;
      font-size: 9px;
      text-align: right;
      word-break: break-all;
    }
  
    #homeButton {
      position: absolute;
      z-index: 20;
      top: 10px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 999px;
      color: #17202a;
      background: rgba(255,255,255,.93);
      box-shadow: 0 5px 18px rgba(0,0,0,.13);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .02em;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    #homeButton:hover {
      transform: translateY(-1px);
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.17);
    }

    #homeButton:active {
      transform: translateY(0);
    }

    #homeButton .homeArrow {
      font-size: 15px;
      line-height: 1;
      transform: translateY(-.5px);
    }

    #pageTitle {
      max-width: calc(100vw - 230px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #loadingBar {
      position: absolute;
      z-index: 19;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #1769aa, #31a8df);
      box-shadow: 0 0 12px rgba(49,168,223,.55);
      transition: width .3s ease, opacity .25s ease;
      opacity: 0;
      pointer-events: none;
    }

    #legend {
      position: absolute;
      z-index: 10;
      top: 54px;
      right: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 12px;
      background: rgba(255,255,255,.90);
      box-shadow: 0 6px 18px rgba(0,0,0,.11);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      color: #3c4852;
      font-size: 10px;
      line-height: 1.45;
      pointer-events: none;
    }

    #legend b {
      color: #17202a;
      font-size: 10px;
    }

    .legendDot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
      vertical-align: 0;
    }

    .legendDot.ok { background: #29a566; }
    .legendDot.late { background: #e38a22; }

    .bus-popup__vehicle-row {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .bus-popup__vehicle-icon-wrap {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,.93);
      box-shadow: 0 4px 14px rgba(0,0,0,.16);
      overflow: hidden;
    }

    .bus-popup__vehicle-icon {
      display: block;
      max-width: 46px;
      max-height: 46px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .bus-popup__vehicle-meta {
      min-width: 0;
    }

    .bus-popup__small {
      margin-top: 3px;
      font-size: 10px;
      opacity: .82;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bus-popup__next {
      margin: 10px 0 12px;
      padding: 10px 11px;
      border-radius: 11px;
      background: #f4f8fb;
      border: 1px solid #e8eef2;
    }

    .bus-popup__next-label {
      margin-bottom: 2px;
      color: #84919c;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .bus-popup__next-name {
      color: #26323b;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .bus-popup__next-time {
      margin-top: 2px;
      color: #60717f;
      font-size: 10px;
    }

    @media (max-width: 640px) {
      #pageTitle {
        top: 48px;
        max-width: calc(100vw - 24px);
        font-size: 12px;
      }

      #legend {
        display: none;
      }

      #statusDisplay {
        max-width: 60vw;
      }

      .maplibregl-popup {
        max-width: 285px !important;
      }
    }

  </style>
</head>

    function cleanId(v) {
      return String(v ?? "").replace(/^"|"$/g, "").trim();
    }

    // =========================================================
    // CSV
    // 簡易split(",")ではなく、引用符入りCSVにも対応
    // =========================================================
    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];

        if (quoted) {
          if (c === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            field += c;
          }
        } else {
          if (c === '"') {
            quoted = true;
          } else if (c === ",") {
            row.push(field);
            field = "";
          } else if (c === "\n") {
            row.push(field.replace(/\r$/, ""));
            rows.push(row);
            row = [];
            field = "";
          } else {
            field += c;
          }
        }
      }

      if (field.length || row.length) {
        row.push(field.replace(/\r$/, ""));
        rows.push(row);
      }

      return rows;
    }

    async function fetchText(url) {
      const r = await fetch(url, { cache: "force-cache" });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${url}`);
      return r.text();
    }

    async function fetchJson(url) {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${url}`);
      return r.json();
    }

    // =========================================================
    // 静的GTFS: 初回に1回だけ読む
    // =========================================================
    async function loadStaticGtfs() {
      const [routesText, tripsText, stopsText, stopTimesText, shapesText] =
        await Promise.all([
          fetchText(GTFS_BASE + "routes.txt"),
          fetchText(GTFS_BASE + "trips.txt"),
          fetchText(GTFS_BASE + "stops.txt"),
          fetchText(GTFS_BASE + "stop_times.txt"),
          fetchText(GTFS_BASE + "shapes.txt")
        ]);

      parseRoutes(routesText);
      parseTrips(tripsText);
      parseStops(stopsText);
      parseStopTimes(stopTimesText);
      parseShapes(shapesText);

      staticGtfsLoaded = true;
    }

    function headerIndex(header) {
      const map = Object.create(null);
      header.forEach((v, i) => map[v] = i);
      return map;
    }

    function parseRoutes(text) {
      const rows = parseCsv(text);
      if (!rows.length) return;
      const h = headerIndex(rows[0]);
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const id = cleanId(r[h.route_id]);
        if (!id) continue;
        routeNames[id] = cleanId(r[h.route_long_name] || r[h.route_short_name]);
      }
    }

    function parseTrips(text) {
      const rows = parseCsv(text);
      if (!rows.length) return;
      const h = headerIndex(rows[0]);
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const tripId = cleanId(r[h.trip_id]);
        if (!tripId) continue;
        tripHeadsigns[tripId] = cleanId(r[h.trip_headsign]);
        tripShapeMap[tripId] = cleanId(r[h.shape_id]);
      }
    }

    function parseStops(text) {
      const rows = parseCsv(text);
      if (!rows.length) return;
      const h = headerIndex(rows[0]);
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const stopId = cleanId(r[h.stop_id]);
        const lat = Number(r[h.stop_lat]);
        const lon = Number(r[h.stop_lon]);
        if (!stopId || !Number.isFinite(lat) || !Number.isFinite(lon)) continue;

        const name = cleanId(r[h.stop_name]);
        stopNames[stopId] = name;
        stopDetails[stopId] = { name, lat, lon };
      }
    }

    function parseStopTimes(text) {
      const rows = parseCsv(text);
      if (!rows.length) return;
      const h = headerIndex(rows[0]);
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const tripId = cleanId(r[h.trip_id]);
        const seq = Number(r[h.stop_sequence]);
        if (!tripId || !Number.isFinite(seq)) continue;

        if (!scheduledTimes[tripId]) scheduledTimes[tripId] = Object.create(null);
        scheduledTimes[tripId][seq] = cleanId(r[h.arrival_time]);
      }
    }

    function parseShapes(text) {
      const rows = parseCsv(text);
      if (!rows.length) return;
      const h = headerIndex(rows[0]);
      const points = Object.create(null);

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const shapeId = cleanId(r[h.shape_id]);
        const lat = Number(r[h.shape_pt_lat]);
        const lon = Number(r[h.shape_pt_lon]);
        const seq = Number(r[h.shape_pt_sequence]);

        if (!shapeId || !Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        if (!points[shapeId]) points[shapeId] = [];
        points[shapeId].push({ seq, lat, lon });
      }

      for (const [shapeId, arr] of Object.entries(points)) {
        arr.sort((a, b) => a.seq - b.seq);
        // MapLibre/GeoJSONは [lon, lat]
        shapeMap[shapeId] = arr.map(p => [p.lon, p.lat]);
      }
    }

    // =========================================================
    // GTFS-RT
    // =========================================================
    async function loadDelays() {
      const data = await fetchJson(TRIP_UPDATE_URL);
      const delays = Object.create(null);

      for (const entity of data.entity || []) {
        const trip = entity?.tripUpdate?.trip;
        const updates = entity?.tripUpdate?.stopTimeUpdate;
        const tripId = cleanId(trip?.tripId);

        if (!tripId || !Array.isArray(updates)) continue;

        const delayMap = Object.create(null);

        for (const update of updates) {
          const seq = Number(update?.stopSequence);
          if (!Number.isFinite(seq)) continue;

          const stopId = cleanId(update?.stopId);
          let delay = 0;

          if (update?.departure?.delay != null) delay = Number(update.departure.delay) || 0;
          else if (update?.arrival?.delay != null) delay = Number(update.arrival.delay) || 0;

          delayMap[seq] = {
            delay,
            stopId,
            arrivalTime: update?.arrival?.time ?? null,
            departureTime: update?.departure?.time ?? null
          };
        }

        delays[tripId] = delayMap;
      }

      tripDelays = delays;
    }

    async function loadVehicles() {
      const data = await fetchJson(VEHICLE_POSITION_URL);
      const vehicles = [];

      for (const entity of data.entity || []) {
        const v = entity?.vehicle;
        const p = v?.position;

        if (!p) continue;

        const lat = Number(p.latitude);
        const lon = Number(p.longitude);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

        vehicles.push({
          tripId: cleanId(v?.trip?.tripId),
          routeId: cleanId(v?.trip?.routeId),
          seq: Number(v?.currentStopSequence),
          label: cleanId(v?.vehicle?.label) || "?",
          lat,
          lon,
          bearing: Number(p.bearing)
        });
      }

      latestVehicles = vehicles;
    }

    // =========================================================
    // 表示用
    // =========================================================
    function formatDelay(sec) {
      sec = Number(sec) || 0;
      if (sec < 60) return "ほぼ定刻";
      const min = Math.floor(sec / 60);
      const rem = Math.abs(Math.floor(sec % 60));
      return `${min}分${rem}秒遅れ`;
    }

    function getDelayForVehicle(v) {
      if (!v.tripId || !Number.isFinite(v.seq)) return 0;

      // 旧版のロジックを維持。次停留所情報を優先。
      const mapForTrip = tripDelays[v.tripId];
      if (!mapForTrip) return 0;

      return mapForTrip[v.seq + 1]?.delay ??
             mapForTrip[v.seq]?.delay ??
             0;
    }

    function vehicleGeoJson() {
      vehicleFeaturesByTrip.clear();

      const features = latestVehicles.map((v, idx) => {
        const delay = getDelayForVehicle(v);
        const routeName = routeNames[v.routeId] || "路線名不明";
        const headsign = tripHeadsigns[v.tripId] || "行先不明";

        const f = {
          type: "Feature",
          id: idx,
          geometry: {
            type: "Point",
            coordinates: [v.lon, v.lat]
          },
          properties: {
            tripId: v.tripId,
            routeId: v.routeId,
            routeName,
            headsign,
            label: v.label,
            delay,
            delayText: formatDelay(delay),
            iconKey: v.label,
            bearing: Number.isFinite(v.bearing) ? v.bearing : 0
          }
        };

        if (v.tripId) vehicleFeaturesByTrip.set(v.tripId, f);
        return f;
      });

      return {
        type: "FeatureCollection",
        features
      };
    }

    function emptyFeatureCollection() {
      return {
        type: "FeatureCollection",
        features: []
      };
    }

    function selectedRouteGeoJson(tripId) {
      const shapeId = tripShapeMap[tripId];
      const coords = shapeMap[shapeId];

      if (!coords?.length) return emptyFeatureCollection();

      return {
        type: "FeatureCollection",
        features: [{
          type: "Feature",
          properties: {},
          geometry: {
            type: "LineString",
            coordinates: coords
          }
        }]
      };
    }

    function futureStopsGeoJson(tripId, currentSeq) {
      const updates = tripDelays[tripId];
      if (!updates) return emptyFeatureCollection();

      const features = [];

      for (const [seqStr, info] of Object.entries(updates)) {
        const seq = Number(seqStr);
        if (!Number.isFinite(seq) || seq <= currentSeq) continue;

        const stopId = cleanId(info.stopId);
        const stop = stopDetails[stopId];
        if (!stop) continue;

        let unixTime = Number(info.arrivalTime || info.departureTime) || null;

        if (!unixTime) {
          const timeStr = scheduledTimes[tripId]?.[seq];
          if (timeStr) {
            const [hh0, mm, ss] = timeStr.split(":").map(Number);
            const now = new Date();
            const dayOffset = Math.floor(hh0 / 24);
            const hh = hh0 % 24;
            const scheduled = new Date(
              now.getFullYear(),
              now.getMonth(),
              now.getDate() + dayOffset,
              hh, mm || 0, ss || 0
            );
            unixTime = Math.floor(scheduled.getTime() / 1000) + (Number(info.delay) || 0);
          }
        }

        const arrivalText = unixTime
          ? new Date(unixTime * 1000).toLocaleTimeString("ja-JP", {
              hour: "2-digit",
              minute: "2-digit"
            })
          : "時刻不明";

        features.push({
          type: "Feature",
          geometry: {
            type: "Point",
            coordinates: [stop.lon, stop.lat]
          },
          properties: {
            stopId,
            name: stop.name || stopNames[stopId] || "停留所名不明",
            arrivalText,
            label: `${stop.name || stopNames[stopId] || "停留所名不明"}（${arrivalText}）`
          }
        });
      }

      return {
        type: "FeatureCollection",
        features
      };
    }

    // =========================================================
    // 車両アイコン画像をMapLibreへ登録
    // 同じPNGは一度しかロードしない
    // =========================================================
    function uniqueVehicleIcons() {
      const urls = new Set(labelIconMap.values());
      urls.add("icon/yokokamo.png");
      return [...urls];
    }

    async function loadImageToMap(url) {
      if (map.hasImage(url)) return;
      try {
        const img = await map.loadImage(url);
        if (!map.hasImage(url)) map.addImage(url, img.data);
      } catch (e) {
        console.warn("アイコン読込失敗:", url, e);
      }
    }

    async function preloadVehicleIcons() {
      // 全画像を並列で一気に読みすぎないよう6個ずつロード
      const urls = uniqueVehicleIcons();
      const concurrency = 6;

      for (let i = 0; i < urls.length; i += concurrency) {
        await Promise.all(urls.slice(i, i + concurrency).map(loadImageToMap));
      }
    }

    function iconExpression() {
      const expr = ["match", ["get", "iconKey"]];

      for (const [label, url] of labelIconMap.entries()) {
        expr.push(label, url);
      }

      expr.push("icon/yokokamo.png");
      return expr;
    }

        map.getSource("selected-stops").setData(emptyFeatureCollection());
      });
    }

    function getVehicleIconUrl(label) {
      return labelIconMap.get(String(label ?? "")) || "icon/yokokamo.png";
    }

    function getNextStopInfo(tripId, currentSeq) {
      const updates = tripDelays[tripId];
      if (!updates) return null;

      const seqs = Object.keys(updates)
        .map(Number)
        .filter(n => Number.isFinite(n) && n > Number(currentSeq))
        .sort((a, b) => a - b);

      if (!seqs.length) return null;

      const seq = seqs[0];
      const info = updates[seq];
      const stopId = cleanId(info?.stopId);
      const stop = stopDetails[stopId];

      if (!stop) return null;

      let unixTime = Number(info?.arrivalTime || info?.departureTime) || null;

      if (!unixTime) {
        const timeStr = scheduledTimes[tripId]?.[seq];
        if (timeStr) {
          const [hh0, mm, ss] = timeStr.split(":").map(Number);
          const now = new Date();
          const dayOffset = Math.floor(hh0 / 24);
          const hh = hh0 % 24;
          const scheduled = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate() + dayOffset,
            hh, mm || 0, ss || 0
          );
          unixTime = Math.floor(scheduled.getTime() / 1000) + (Number(info?.delay) || 0);
        }
      }

      return {
        name: stop.name || stopNames[stopId] || "停留所名不明",
        timeText: unixTime
          ? new Date(unixTime * 1000).toLocaleTimeString("ja-JP", {
              hour: "2-digit",
              minute: "2-digit"
            })
          : "時刻不明"
      };
    }

    function setLoading(active, progress = 72) {
      const bar = document.getElementById("loadingBar");
      if (!bar) return;

      if (active) {
        bar.style.opacity = "1";
        bar.style.width = `${Math.max(8, Math.min(92, progress))}%`;
      } else {
        bar.style.width = "100%";
        setTimeout(() => {
          bar.style.opacity = "0";
          setTimeout(() => { bar.style.width = "0%"; }, 260);
        }, 140);
      }
    }

    function buildBusPopupHtml(p) {
      const delay = Number(p.delay) || 0;
      const delayClass = delay < 60
        ? "bus-popup__delay--ok"
        : "bus-popup__delay--late";
      const delayIcon = delay < 60 ? "●" : "▲";

      const current = latestVehicles.find(v => v.tripId === p.tripId);
      const next = getNextStopInfo(p.tripId, Number(current?.seq));
      const iconUrl = getVehicleIconUrl(p.label);

      return `
        <div class="bus-popup">
          <div class="bus-popup__hero">
            <div class="bus-popup__eyebrow">FUKUSHIMA KOTSU · LIVE</div>

            <div class="bus-popup__vehicle-row">
              <div class="bus-popup__vehicle-icon-wrap">
                <img class="bus-popup__vehicle-icon"
                     src="${escapeHtml(iconUrl)}"
                     alt="">
              </div>

              <div class="bus-popup__vehicle-meta">
                <div class="bus-popup__vehicle">車両 ${escapeHtml(p.label)}</div>
                <div class="bus-popup__small">
                  ${escapeHtml(p.routeId || "route ?")} · trip ${escapeHtml(p.tripId || "-")}
                </div>
              </div>
            </div>
          </div>

          <div class="bus-popup__body">
            <div class="bus-popup__route">${escapeHtml(p.routeName)}</div>

            <div class="bus-popup__destination">
              <span>${escapeHtml(p.headsign)}</span>
            </div>

            ${next ? `
              <div class="bus-popup__next">
                <div class="bus-popup__next-label">NEXT STOP</div>
                <div class="bus-popup__next-name">${escapeHtml(next.name)}</div>
                <div class="bus-popup__next-time">予想到着 ${escapeHtml(next.timeText)}</div>
              </div>
            ` : ""}

            <div class="bus-popup__footer">
              <span class="bus-popup__delay ${delayClass}">
                <span>${delayIcon}</span>
                <span>${escapeHtml(p.delayText)}</span>
              </span>

              <span class="bus-popup__trip">
                LIVE
              </span>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================================================
    // リアルタイム更新
    // =========================================================
    async function updateRealtime() {
      if (updateRunning) return;
      updateRunning = true;

      const status = document.getElementById("statusDisplay");
      setLoading(true, 68);

      try {
        await Promise.all([
          loadDelays(),
          loadVehicles()
        ]);

        map.getSource("vehicles").setData(vehicleGeoJson());

        // 選択中の便だけルート/停留所を更新
        if (selectedTripId) {
          const current = latestVehicles.find(v => v.tripId === selectedTripId);

          if (current) {
            const selectedFeature = vehicleFeaturesByTrip.get(selectedTripId);
            map.getSource("selected-vehicle").setData(
              selectedFeature
                ? { type: "FeatureCollection", features: [selectedFeature] }
                : emptyFeatureCollection()
            );

            map.getSource("selected-route")
              .setData(selectedRouteGeoJson(selectedTripId));

            map.getSource("selected-stops")
              .setData(futureStopsGeoJson(selectedTripId, Number(current.seq)));
          } else {
            selectedTripId = null;
            map.getSource("selected-vehicle").setData(emptyFeatureCollection());
            map.getSource("selected-route").setData(emptyFeatureCollection());
            map.getSource("selected-stops").setData(emptyFeatureCollection());
          }
        }

        document.getElementById("readableTimestamp").textContent =
          new Date().toLocaleString("ja-JP");

        status.textContent = `LIVE  ${latestVehicles.length}台運行中`;
      } catch (e) {
        console.error(e);
        status.textContent = "リアルタイムデータ取得失敗";
      } finally {
        updateRunning = false;
        setLoading(false);
      }
    }

    // =========================================================
    // 起動
    // =========================================================
    map.on("load", async () => {
      const status = document.getElementById("statusDisplay");

      try {
        status.textContent = "GTFS読込中...";
        setLoading(true, 35);

        // GTFSとアイコンを並行ロード
        await Promise.all([
          loadStaticGtfs(),
          preloadVehicleIcons()
        ]);

        installLayers();

        status.textContent = "リアルタイム情報取得中...";
        setLoading(true, 72);
        await updateRealtime();

        setInterval(updateRealtime, UPDATE_INTERVAL);
      } catch (e) {
        console.error(e);
        status.textContent = "初期化に失敗しました";
        setLoading(false);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福島交通バスロケーション</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">

  <link rel="stylesheet" href="./fukushima.css">

</head>

<body>
  <div id="loadingBar"></div>
  <div id="map"></div>
  <a id="homeButton" href="/" aria-label="トップページに戻る">
    <span class="homeArrow">←</span>
    <span>トップへ</span>
  </a>
  <div id="pageTitle">福島交通ロケーションマップ</div>
  <div id="legend">
    <b>LIVE STATUS</b><br>
    <span class="legendDot ok"></span>ほぼ定刻　
    <span class="legendDot late"></span>遅れ
  </div>
  <div id="statusDisplay">読込中...</div>
  <div id="timestampDisplay">最終更新: <span id="readableTimestamp">-</span></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <script src="./fukushima.js"></script>

</body>
</html>
